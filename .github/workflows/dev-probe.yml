name: 개발용 게시판 진단 (임시)

# 부산 게시판 조사용 임시 작업. 병합 전에 지운다.
on:
  push:
    branches: [claude/jolly-galileo-kgtfjx]
    paths: [scripts/dev_probe.sh, scripts/dev_fetch.py, .github/workflows/dev-probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      ATTEMPT: ${{ matrix.attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 러너 위치
        run: curl -s -m 10 https://ipinfo.io/json | grep -E '"(ip|city|region|country|org)"' || true
      - run: set -f; mkdir -p probe_out; bash scripts/dev_probe.sh 2>&1 | tee probe_out/_log.txt
      - name: 받은 페이지 보관 (probe-out 브랜치, 첫 번째 시도만)
        if: always() && matrix.attempt == 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -d probe_out ] && [ -n "$(ls -A probe_out)" ]; then
            cd probe_out
            git init -q -b probe-out
            git add -A
            git -c user.name=probe -c user.email=probe@example.invalid commit -qm "probe out ${GITHUB_RUN_ID}"
            git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-out
          fi
